<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>{{ shop_name }}</title>
<style>
body { font-family: sans-serif; margin: 2rem; background: #fff8f0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0002; padding: 1rem; }
.card h3 { margin: 0 0 .5rem; font-size: 1rem; }
.amount { color: #e8590c; font-size: 1.4rem; font-weight: bold; }
.avail.out { color: #999; }
</style></head>
<body>
<h1>🛒 {{ shop_name }}</h1>
<div class="grid">
{% for item in items %}
  <div class="card" data-code="{{ item.sku }}" id="{{ item.sku }}">
    <h3>{{ item.name }}</h3>
    <span class="amount">$ {{ item.price }}</span>
    {% if item.stock > 0 %}
    <p class="avail">剩 {{ item.stock }} 件</p>
    {% else %}
    <p class="avail out">已售完</p>
    {% endif %}
  </div>
{% endfor %}
</div>
</body>
</html>

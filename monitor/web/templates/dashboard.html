{% extends "base.html" %}
{% block content %}
<section>
  <h2>監控商品</h2>
  <p class="muted">每 {{ interval | round(1) }} 分鐘自動檢查一次；本頁每 15 秒自動更新。</p>
  <form class="add" hx-post="/products" hx-target="#products" hx-swap="outerHTML"
        hx-on::after-request="if (event.detail.successful) this.reset()">
    <input name="url" type="url" required placeholder="商品網址，例如 http://shop-a.localhost:8001/products#P001">
    <label>降價門檻 <input name="threshold_pct" type="number" step="0.1" min="0" value="5">%</label>
    <button>加入監控</button>
  </form>
  {% include "_products.html" %}
</section>
<section>
  <h2>最近事件 <a class="small" href="/events">全部 →</a></h2>
  {% include "_events.html" %}
</section>
{% endblock %}

<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>樂購網</title>
<style>
body { font-family: sans-serif; margin: 2rem; background: #fff8f0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1rem; }
.card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px #0002; padding: 1rem; }
.card h3 { margin: 0 0 .5rem; font-size: 1rem; }
.amount { color: #e8590c; font-size: 1.4rem; font-weight: bold; }
.avail.out { color: #999; }
</style></head>
<body>
<h1>🛒 樂購網</h1>
<div class="grid">

  <div class="card" data-code="P001" id="P001">
    <h3>無線藍牙耳機</h3>
    <span class="amount">$ 1930</span>
    
    <p class="avail">剩 25 件</p>
    
  </div>

  <div class="card" data-code="P002" id="P002">
    <h3>行動電源 10000mAh</h3>
    <span class="amount">$ 860</span>
    
    <p class="avail out">已售完</p>
    
  </div>

  <div class="card" data-code="P003" id="P003">
    <h3>USB-C 快充充電器 65W</h3>
    <span class="amount">$ 1250</span>
    
    <p class="avail">剩 18 件</p>
    
  </div>

  <div class="card" data-code="P004" id="P004">
    <h3>機械式鍵盤</h3>
    <span class="amount">$ 2420</span>
    
    <p class="avail">剩 9 件</p>
    
  </div>

  <div class="card" data-code="P005" id="P005">
    <h3>無線滑鼠</h3>
    <span class="amount">$ 670</span>
    
    <p class="avail">剩 60 件</p>
    
  </div>

  <div class="card" data-code="P006" id="P006">
    <h3>27 吋 4K 螢幕</h3>
    <span class="amount">$ 8720</span>
    
    <p class="avail">剩 5 件</p>
    
  </div>

</div>
</body>
</html>
